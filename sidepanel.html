<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>媒体资源嗅探器</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <nav class="mode-tabs" aria-label="下载模式">
        <button id="single-tab" class="mode-tab active" type="button" aria-selected="true">单个下载</button>
        <button id="batch-tab" class="mode-tab" type="button" aria-selected="false">批量下载</button>
      </nav>

      <section id="single-view">
        <header>
          <div>
            <h1>媒体资源</h1>
            <p id="page-title">正在读取当前页面…</p>
          </div>
          <button id="refresh" type="button">刷新</button>
        </header>

        <section id="download-area" class="download-area" hidden>
          <div class="download-heading">
            <strong>当前下载</strong>
            <button id="clear-download" class="secondary-button" type="button" hidden>清除记录</button>
          </div>
          <p id="download-status" role="status"></p>
          <progress id="download-progress" max="100" value="0" hidden></progress>
          <p id="download-size"></p>
        </section>

        <p id="status" role="status"></p>
        <section id="candidates" aria-live="polite"></section>
      </section>

      <section id="batch-view" hidden>
        <h1>批量下载</h1>
        <p class="batch-note">本阶段只解析链接，不会自动打开页面或下载。</p>
        <label class="file-picker">
          <span>导入 TXT</span>
          <input id="batch-file" type="file" accept=".txt,text/plain" />
        </label>
        <textarea id="batch-links" rows="8" placeholder="也可以直接粘贴腾讯会议链接，每行一个"></textarea>
        <button id="parse-batch" type="button">解析链接</button>
        <p id="batch-summary" class="batch-summary">尚未解析</p>
        <ol id="batch-list" class="batch-list"></ol>
        <button id="start-batch" class="disabled-action" type="button" disabled>开始批量下载（下一阶段启用）</button>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
