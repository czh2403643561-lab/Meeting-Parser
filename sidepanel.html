<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>媒体资源嗅探器</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <nav class="mode-tabs" aria-label="下载模式">
        <button id="single-tab" class="mode-tab active" type="button" aria-selected="true">单个下载</button>
        <button id="batch-tab" class="mode-tab" type="button" aria-selected="false">批量下载</button>
      </nav>

      <section id="single-view">
        <header>
          <div>
            <h1>媒体资源</h1>
            <p id="page-title">正在读取当前页面…</p>
          </div>
          <button id="refresh" type="button">刷新</button>
        </header>

        <section id="download-area" class="download-area" hidden>
          <div class="download-heading">
            <strong>当前下载</strong>
            <button id="clear-download" class="secondary-button" type="button" hidden>清除记录</button>
          </div>
          <p id="download-status" role="status"></p>
          <progress id="download-progress" max="100" value="0" hidden></progress>
          <p id="download-size"></p>
        </section>

        <p id="status" role="status"></p>
        <section id="candidates" aria-live="polite"></section>
      </section>

      <section id="batch-view" hidden>
        <h1>批量下载</h1>
        <p class="batch-note">严格按顺序下载；工作标签页关闭后可继续任务。</p>
        <label class="file-picker">
          <span>导入 TXT</span>
          <input id="batch-file" type="file" accept=".txt,text/plain" />
        </label>
        <textarea id="batch-links" rows="8" placeholder="也可以直接粘贴腾讯会议链接，每行一个"></textarea>
        <button id="parse-batch" type="button">解析链接</button>
        <label class="preference-label">优先下载
          <select id="media-preference">
            <option value="auto">自动（普通录制优先）</option>
            <option value="screen">屏幕画面</option>
            <option value="speaker">发言人画面</option>
          </select>
        </label>
        <p id="batch-summary" class="batch-summary">尚未解析</p>
        <section id="batch-total-progress" class="batch-progress" hidden>
          <strong id="batch-total-label"></strong>
          <progress id="batch-total-bar" max="100" value="0"></progress>
        </section>
        <section id="batch-progress" class="batch-progress" hidden>
          <strong id="batch-current"></strong>
          <p id="batch-status" role="status"></p>
          <progress id="batch-file-progress" max="100" value="0" hidden></progress>
          <p id="batch-size"></p>
        </section>
        <ol id="batch-list" class="batch-list"></ol>
        <div class="batch-actions">
          <button id="start-batch" type="button">开始批量下载</button>
          <button id="pause-batch" class="secondary-button" type="button" hidden>暂停</button>
          <button id="resume-batch" type="button" hidden>继续</button>
        </div>
        <section class="batch-logs">
          <div class="download-heading">
            <strong>运行日志</strong>
            <span>
              <button id="toggle-batch-logs" class="secondary-button" type="button">查看运行日志</button>
              <button id="export-batch-logs" class="secondary-button" type="button">导出日志</button>
              <button id="clear-batch-logs" class="secondary-button" type="button">清空日志</button>
            </span>
          </div>
          <pre id="batch-log-output" hidden></pre>
        </section>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
